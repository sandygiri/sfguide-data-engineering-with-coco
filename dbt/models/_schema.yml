version: 2

models:
  - name: customers
    description: Customer dimension table containing customer details enriched with nation and region.
    columns:
      - name: customer_key
        description: Primary key for customers.
        tests:
          - unique
          - not_null

      - name: customer_name
        description: Name of the customer.
        tests:
          - not_null

      - name: market_segment
        description: Customer market segment.
        tests:
          - not_null
          - accepted_values:
              values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']

      - name: nation
        description: Nation name of the customer.
        tests:
          - not_null

      - name: region
        description: Region name of the customer.
        tests:
          - not_null

  - name: orders_summary
    description: Aggregated order summary table with pricing and line item metrics.
    columns:
      - name: order_key
        description: Primary key for orders_summary.
        tests:
          - unique
          - not_null

      - name: customer_key
        description: Foreign key referencing customers.
        tests:
          - not_null
          - relationships:
              to: ref('customers')
              field: customer_key

      - name: order_status
        description: Status code of the order.
        tests:
          - not_null
          - accepted_values:
              values: ['O', 'F', 'P']

      - name: order_priority
        description: Priority classification of the order.
        tests:
          - not_null
          - accepted_values:
              values: ['1-URGENT', '2-HIGH', '3-MEDIUM', '4-NOT SPECIFIED', '5-LOW']

      - name: order_date
        description: Date the order was placed.
        tests:
          - not_null

      - name: order_total_price
        description: Total price of the order.
        tests:
          - not_null

      - name: line_item_count
        description: Total number of line items in the order.
        tests:
          - not_null

  - name: supplier_performance
    description: Supplier performance summary metrics including total orders, total revenue, and average discount.
    columns:
      - name: supplier_key
        description: Primary key for supplier_performance.
        tests:
          - unique
          - not_null

      - name: supplier_name
        description: Name of the supplier.
        tests:
          - not_null

      - name: total_orders
        description: Total number of distinct orders fulfilled by the supplier.
        tests:
          - not_null

      - name: total_revenue
        description: Total revenue generated by the supplier.
        tests:
          - not_null

      - name: average_discount
        description: Average discount applied across supplier line items.
        tests:
          - not_null
